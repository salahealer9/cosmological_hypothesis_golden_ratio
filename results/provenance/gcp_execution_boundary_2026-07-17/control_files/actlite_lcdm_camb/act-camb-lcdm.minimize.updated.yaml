theory:
  camb:
    version: 1.5.0
    path: null
    speed: 0.3
    stop_at_error: false
    extra_args:
      kmax: 10
      k_per_logint: 130
      nonlinear: true
      lens_potential_accuracy: 8
      lens_margin: 2050
      lAccuracyBoost: 1.2
      min_l_logl_sampling: 6000
      DoLateRadTruncation: false
      recombination_model: CosmoRec
    ignore_obsolete: false
    use_renames: false
    external_primordial_pk: false
    renames:
      omegabh2: ombh2
      omegach2: omch2
      omegal: omega_de
      omegak: omk
      yhe: YHe
      yheused: YHe
      YpBBN: Y_p
    params:
      H0:
        latex: H_0
        derived: true
      thetastar:
        latex: \theta_\star
        derived: true
      sigma8:
        latex: \sigma_8
        derived: true
      YHe:
        latex: Y_\mathrm{He}
        derived: true
      zrei:
        latex: z_\mathrm{reio}
        derived: true
      taurend:
        latex: \tau_\mathrm{rec}
        derived: true
      zstar:
        latex: z_\star
        derived: true
      rstar:
        latex: r_{s,\star}
        derived: true
      zdrag:
        latex: z_d
        derived: true
    input_params:
    - As
    - ns
    - ombh2
    - omch2
    - cosmomc_theta
    - tau
    output_params:
    - H0
    - thetastar
    - sigma8
    - YHe
    - zrei
    - taurend
    - zstar
    - rstar
    - zdrag
likelihood:
  planck_2018_lowl.EE_sroll2:
    type: CMB
    aliases:
    - lowE
    speed: -1
    stop_at_error: false
    version: null
    input_params: []
    output_params: []
  act_dr6_cmbonly.ACTDR6CMBonly:
    data_folder: ACTDR6CMBonly
    ell_cuts:
      TT:
      - 600
      - 8500
      TE:
      - 600
      - 8500
      EE:
      - 600
      - 8500
    lmax_theory: 9000
    type: []
    speed: -1
    stop_at_error: true
    version: null
    input_file: dr6_data_cmb_sacc_oct22.fits
    input_params:
    - A_act
    - P_act
    output_params: []
prior:
  cal_dip_prior: 'lambda A_act: stats.norm.logpdf(A_act, loc = 1.0, scale = 0.003)'
params:
  ombh2:
    prior:
      min: 0.017
      max: 0.027
    ref:
      dist: norm
      loc: 0.02239
      scale: 0.0021
    proposal: 6.5e-05
    latex: \Omega_\mathrm{b}h^2
    renames:
    - omegabh2
  omch2:
    prior:
      min: 0.09
      max: 0.15
    ref:
      dist: norm
      loc: 0.12
      scale: 0.026
    proposal: 0.0011
    latex: \Omega_\mathrm{c}h^2
    renames:
    - omegach2
  cosmomc_theta:
    prior:
      min: 0.0103
      max: 0.0105
    ref:
      dist: norm
      loc: 0.010417
      scale: 6.7e-05
    proposal: 1.0e-05
    latex: \theta_\mathrm{MC}
  logA:
    prior:
      min: 2.6
      max: 3.5
    ref:
      dist: norm
      loc: 3.064
      scale: 0.24
    proposal: 0.0036
    latex: \log(10^{10} A_\mathrm{s})
  As:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
    derived: true
  ns:
    prior:
      min: 0.9
      max: 1.1
    ref:
      dist: norm
      loc: 0.9729
      scale: 0.061
    proposal: 0.0033
    latex: n_\mathrm{s}
  tau:
    prior:
      min: 0.0
      max: 0.1
    ref:
      dist: norm
      loc: 0.0544
      scale: 0.0073
    proposal: 0.0073
    latex: \tau_\mathrm{reio}
  H0:
    latex: H_0
    derived: true
  thetastar:
    latex: \theta_\star
    derived: true
  sigma8:
    latex: \sigma_8
    derived: true
  YHe:
    latex: Y_\mathrm{He}
    derived: true
    renames:
    - yheused
    - yhe
  zrei:
    latex: z_\mathrm{reio}
    derived: true
  taurend:
    latex: \tau_\mathrm{rec}
    derived: true
  zstar:
    latex: z_\star
    derived: true
  rstar:
    latex: r_{s,\star}
    derived: true
  zdrag:
    latex: z_d
    derived: true
  A_act:
    prior:
      min: 0.5
      max: 1.5
    ref:
      dist: norm
      loc: 1.0
      scale: 0.01
    proposal: 0.003
    latex: A_{\rm ACT}
  P_act:
    prior:
      min: 0.9
      max: 1.1
    ref:
      dist: norm
      loc: 1.0
      scale: 0.01
    proposal: 0.01
    latex: p_{\rm ACT}
  chi2__CMB:
    latex: \chi^2_\mathrm{CMB}
    derived: true
sampler:
  minimize:
    method: bobyqa
    ignore_prior: false
    max_evals: 1e6d
    best_of: 2
    confidence_for_unbounded: 0.9999995
    seed: null
    override_scipy: null
    override_bobyqa:
      rhoend: 0.05
    override_iminuit: null
    covmat: null
    covmat_params: null
    version: null
    fallback_covmat_scale: 4
output: act-camb-lcdm
minimize: true
version: 3.5.4
