[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "golden-ratio-cosmology"
version = "0.1.0"
description = "Reproducible tests of a golden-ratio cosmological constraint"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Salah-Eddin Gherbi"}
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
